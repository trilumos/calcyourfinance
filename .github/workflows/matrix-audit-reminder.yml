name: rate-audit-reminder

# The manual full-scope audit reminders → Telegram.
#   1st of month  → FULL audit (all 42 fee calculators)
#   15th of month → Tier 1 only (the 9 high-priority calculators)
# Every check is full scope (all countries, all variants) — the tier only
# changes frequency. The weekly rate-verify.yml is the between-audits tripwire.
on:
  schedule:
    - cron: "0 7 1 * *" # 1st, 07:00 UTC — full audit
    - cron: "0 7 15 * *" # 15th, 07:00 UTC — Tier 1
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telegram audit reminder
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "no telegram secrets"; exit 0; fi
          DAY=$(date -u +%d)
          # Read the tier list from the repo so the reminder can never drift from
          # src/config/verification-tiers.ts.
          TIER1=$(node -e "
            const s=require('fs').readFileSync('src/config/verification-tiers.ts','utf8');
            const m=s.match(/TIER1_SLUGS = \[([\s\S]*?)\]/);
            const l=[...m[1].matchAll(/\"([a-z0-9-]+)\"/g)].map(x=>x[1].replace(/-(fee|profit)-calculator|-calculator/,''));
            process.stdout.write(l.join(', '));
          ")
          if [ "$DAY" = "15" ]; then
            SET="🔴 *Tier 1 audit* — the twice-monthly mid-month check"
            SCOPE="Due today: $TIER1"
          else
            SET="*Full monthly audit* — every rate-backed calculator"
            SCOPE="Due today: all 42, Tier 1 first ($TIER1)"
          fi
          MATRIX="$SERVER/$REPO/blob/main/rate-verification/matrix.md"
          TEXT=$(printf '🗓️ Rate audit due: %s\n\n%s\n\nFull scope — every country and every fee variant, triangulated against the official page. Say “recheck” to Claude; it reads today’s date, verifies what is due, and logs the session to /verification.\n\n📋 Checklist: %s' "$SET" "$SCOPE" "$MATRIX")
          curl -sS --max-time 20 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=$TEXT" >/dev/null
          echo "audit reminder sent (day $DAY)"
